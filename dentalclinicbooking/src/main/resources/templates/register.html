<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สร้างบัญชี | Dental Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eaf7ff 0%, #d9edff 45%, #b9dfff 100%);
            color: #123a5c;
            min-height: 100vh;
        }
        .panel {
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(13, 88, 151, 0.16);
        }
        .btn-primary {
            background: linear-gradient(135deg, #2f7ddc, #4da5ff);
            border: none;
            border-radius: 999px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="panel p-4 p-md-5">
                    <h2 class="fw-bold mb-2">สร้างบัญชี</h2>
                    <p class="text-muted mb-4">เลือกประเภทบัญชีเพื่อเริ่มใช้บริการทันตกรรมของคุณ</p>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="card h-100 border-0 shadow-sm">
                                <div class="card-body">
                                    <h5 class="card-title">ผู้ป่วย</h5>
                                    <p class="card-text text-muted">สมัครเพื่อจองคิว ตรวจสุขภาพฟัน และดูประวัติการนัดหมาย</p>
                                    <a href="/register/patient" class="btn btn-primary w-100">สมัครผู้ป่วย</a>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card h-100 border-0 shadow-sm">
                                <div class="card-body">
                                    <h5 class="card-title">หมอ</h5>
                                    <p class="card-text text-muted">สมัครเพื่อเข้าร่วมเป็นแพทย์ในคลินิกและดูการนัดหมาย</p>
                                    <a href="/register/doctor" class="btn btn-outline-primary w-100">สมัครหมอ</a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <p class="text-center mt-4 mb-0">
                        มีบัญชีอยู่แล้ว? <a href="/login">เข้าสู่ระบบ</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
