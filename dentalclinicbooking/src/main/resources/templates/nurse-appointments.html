<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าพยาบาล | Dental Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef7ff 0%, #dfefff 45%, #cce7ff 100%);
            color: #123a5c;
            min-height: 100vh;
        }
        .panel {
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(13, 88, 151, 0.16);
        }
        .badge-approved { background-color: #2fbf71; }
        .badge-pending { background-color: #f4b400; }
        .btn-primary { background: linear-gradient(135deg, #2f7ddc, #4da5ff); border: none; border-radius: 999px; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="panel p-4 p-md-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1">หน้าพยาบาล</h2>
                    <p class="text-muted mb-0">รายการนัดหมายสำหรับพยาบาล</p>
                </div>
                <a href="/" class="btn btn-primary">กลับหน้าแรก</a>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-primary">
                        <tr>
                            <th>#</th>
                            <th>ชื่อผู้ป่วย</th>
                            <th>เบอร์โทร</th>
                            <th>บริการ</th>
                            <th>วันที่</th>
                            <th>เวลา</th>
                            <th>สถานะ</th>
                            <th>ดำเนินการ</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${appointments}">
                            <td th:text="${item.id}"></td>
                            <td th:text="${item.patientName}"></td>
                            <td th:text="${item.phone}"></td>
                            <td th:text="${item.service}"></td>
                            <td th:text="${item.appointmentDate}"></td>
                            <td th:text="${item.appointmentTime}"></td>
                            <td>
                                <span th:classappend="${item.status == 'อนุมัติแล้ว'} ? 'badge-approved' : 'badge-pending'"
                                      class="badge rounded-pill text-white"
                                      th:text="${item.status}"></span>
                            </td>
                            <td>
                                <div class="d-flex gap-2">
                                    <form th:action="@{/nurse/appointments/{id}/approve(id=${item.id})}" method="post">
                                        <button class="btn btn-sm btn-outline-primary" type="submit">อนุมัติ</button>
                                    </form>
                                    <form th:action="@{/nurse/appointments/{id}/reject(id=${item.id})}" method="post">
                                        <button class="btn btn-sm btn-outline-danger" type="submit">ปฏิเสธ</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
