<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จองคิว | Dental Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eaf7ff 0%, #d9edff 45%, #b9dfff 100%);
            color: #123a5c;
            min-height: 100vh;
        }
        .panel {
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(13, 88, 151, 0.16);
        }
        .btn-primary {
            background: linear-gradient(135deg, #2f7ddc, #4da5ff);
            border: none;
            border-radius: 999px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="panel p-4 p-md-5">
                    <h2 class="fw-bold mb-2">จองคิวทันตกรรม</h2>
                    <p class="text-muted mb-4">เลือกวันที่และบริการที่ต้องการ</p>
                    <div th:if="${param.success != null}" class="alert alert-success">บันทึกการจองเรียบร้อยแล้ว</div>
                    <form th:action="@{/booking}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">ชื่อผู้ป่วย</label>
                                <input type="text" class="form-control" name="patientName" placeholder="ชื่อของคุณ" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">เบอร์โทร</label>
                                <input type="text" class="form-control" name="phone" placeholder="08xxxxxxxx" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">อีเมล</label>
                                <input type="email" class="form-control" name="email" placeholder="you@example.com">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">วันที่</label>
                                <input type="date" class="form-control" name="appointmentDate" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">เวลาที่ต้องการ</label>
                                <select class="form-select" name="appointmentTime">
                                    <option>09:00</option>
                                    <option>10:30</option>
                                    <option>13:00</option>
                                    <option>15:30</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">บริการ</label>
                                <select class="form-select" name="service">
                                    <option>ตรวจฟันทั่วไป</option>
                                    <option>อุดฟัน</option>
                                    <option>ขูดหินปูน</option>
                                    <option>รากฟันเทียม</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">รายละเอียดเพิ่มเติม</label>
                                <textarea class="form-control" name="notes" rows="3" placeholder="ระบุอาการหรือรายละเอียดเพิ่มเติม"></textarea>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary mt-4">ยืนยันการจอง</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
