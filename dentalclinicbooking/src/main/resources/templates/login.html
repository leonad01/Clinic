<!DOCTYPE html><html lang="th" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>เข้าสู่ระบบ | Dental Clinic</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5"><div class="row justify-content-center"><div class="col-md-6 col-lg-5"><section class="card shadow-sm border-0"><div class="card-body p-4 p-md-5"><h1 class="h2 fw-bold">เข้าสู่ระบบผู้ป่วย</h1><p class="text-muted mb-4">ใช้ username และรหัสผ่านเพื่อจองคิว</p><div th:if="${param.error}" class="alert alert-danger">Username หรือรหัสผ่านไม่ถูกต้อง</div><div th:if="${param.registered}" class="alert alert-success">สมัครสมาชิกสำเร็จ กรุณาเข้าสู่ระบบ</div><div th:if="${param.logout}" class="alert alert-success">ออกจากระบบแล้ว</div><form th:action="@{/login}" method="post"><div class="mb-3"><label class="form-label">Username</label><input type="text" name="username" class="form-control" autocomplete="username" required autofocus></div><div class="mb-3"><label class="form-label">รหัสผ่าน</label><input type="password" name="password" class="form-control" autocomplete="current-password" required></div><button type="submit" class="btn btn-primary w-100">เข้าสู่ระบบ</button></form><p class="text-center mt-3 mb-0">ยังไม่มีบัญชี? <a href="/register/patient">สมัครสมาชิกผู้ป่วย</a></p></div></section></div></div></main></body></html>
