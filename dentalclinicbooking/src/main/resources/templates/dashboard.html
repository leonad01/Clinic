<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Dental Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #eef7ff, #dbeeff); color: #123a5c; }
        .card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(12, 80, 137, 0.12); }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Dashboard คลินิก</h2>
            <p class="text-muted mb-0">ภาพรวมการจองคิวทันตกรรม</p>
        </div>
        <a href="/" class="btn btn-primary">กลับหน้าแรก</a>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="card p-4">
                <div class="text-muted">ทั้งหมด</div>
                <div class="display-6 fw-bold" th:text="${totalCount}"></div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-4">
                <div class="text-muted">รออนุมัติ</div>
                <div class="display-6 fw-bold text-warning" th:text="${pendingCount}"></div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-4">
                <div class="text-muted">อนุมัติแล้ว</div>
                <div class="display-6 fw-bold text-success" th:text="${approvedCount}"></div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-4">
                <div class="text-muted">ปฏิเสธแล้ว</div>
                <div class="display-6 fw-bold text-danger" th:text="${rejectedCount}"></div>
            </div>
        </div>
    </div>

    <div class="card p-4">
        <h5 class="fw-bold mb-3">รายการการจองล่าสุด</h5>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-primary">
                <tr>
                    <th>#</th>
                    <th>ชื่อผู้ป่วย</th>
                    <th>บริการ</th>
                    <th>วันที่</th>
                    <th>เวลา</th>
                    <th>สถานะ</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${appointments}">
                    <td th:text="${item.id}"></td>
                    <td th:text="${item.patientName}"></td>
                    <td th:text="${item.service}"></td>
                    <td th:text="${item.appointmentDate}"></td>
                    <td th:text="${item.appointmentTime}"></td>
                    <td>
                        <span class="badge rounded-pill text-white"
                              th:classappend="${item.status == 'อนุมัติแล้ว'} ? 'bg-success' : (${item.status == 'ปฏิเสธแล้ว'} ? 'bg-danger' : 'bg-warning')"
                              th:text="${item.status}"></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
