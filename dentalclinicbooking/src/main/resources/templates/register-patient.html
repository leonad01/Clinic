<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิกผู้ป่วย | Dental Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <section class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="h2 fw-bold mb-2">สมัครสมาชิกผู้ป่วย</h1>
                        <p class="text-muted mb-4">สร้างบัญชีเพื่อเข้าสู่ระบบและจองคิวทันตกรรม</p>

                        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                        <form th:action="@{/register/patient}" th:object="${patient}" method="post">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label" for="firstName">ชื่อ</label>
                                    <input id="firstName" th:field="*{firstName}" class="form-control" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label" for="lastName">นามสกุล</label>
                                    <input id="lastName" th:field="*{lastName}" class="form-control" required>
                                </div>

                                <div class="col-12">
                                    <label class="form-label" for="username">Username</label>
                                    <input id="username" th:field="*{username}" class="form-control" autocomplete="username" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label" for="dateOfBirth">วันเกิด</label>
                                    <input id="dateOfBirth" type="date" th:field="*{dateOfBirth}" class="form-control" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label" for="gender">เพศ</label>
                                    <select id="gender" th:field="*{gender}" class="form-select" required>
                                        <option value="">เลือกเพศ</option>
                                        <option value="MALE">ชาย</option>
                                        <option value="FEMALE">หญิง</option>
                                        <option value="OTHER">อื่น ๆ / ไม่ระบุ</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label" for="password">รหัสผ่าน</label>
                                    <input id="password" type="password" th:field="*{passwordHash}" class="form-control" autocomplete="new-password" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label" for="confirmPassword">ยืนยันรหัสผ่าน</label>
                                    <input id="confirmPassword" type="password" th:field="*{confirmPassword}" class="form-control" autocomplete="new-password" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mt-4">สมัครสมาชิก</button>
                        </form>

                        <p class="text-center mt-4 mb-0">
                            มีบัญชีแล้ว? <a href="/login">เข้าสู่ระบบ</a>
                        </p>
                    </div>
                </section>
            </div>
        </div>
    </main>
</body>
</html>
