<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายละเอียดการนัด | Dental Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <div class="card p-4">
        <h2 class="fw-bold mb-3">รายละเอียดการนัดหมาย</h2>
        <div class="row g-3">
            <div class="col-md-6">
                <p><strong>ชื่อผู้ป่วย:</strong> <span th:text="${appointment.patientName}"></span></p>
                <p><strong>เบอร์โทร:</strong> <span th:text="${appointment.phone}"></span></p>
                <p><strong>อีเมล:</strong> <span th:text="${appointment.email}"></span></p>
            </div>
            <div class="col-md-6">
                <p><strong>วันที่:</strong> <span th:text="${appointment.appointmentDate}"></span></p>
                <p><strong>เวลา:</strong> <span th:text="${appointment.appointmentTime}"></span></p>
                <p><strong>บริการ:</strong> <span th:text="${appointment.service}"></span></p>
            </div>
            <div class="col-12">
                <p><strong>สถานะ:</strong> <span th:text="${appointment.status}"></span></p>
                <p><strong>รายละเอียดเพิ่มเติม:</strong> <span th:text="${appointment.notes}"></span></p>
            </div>
        </div>
        <a href="/dashboard" class="btn btn-primary mt-4">กลับ Dashboard</a>
    </div>
</div>
</body>
</html>
