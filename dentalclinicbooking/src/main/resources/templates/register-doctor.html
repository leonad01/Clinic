<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครหมอ | Dental Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="fw-bold mb-2">สมัครสมาชิกสำหรับหมอ</h2>
                    <p class="text-muted">ข้อมูลจะถูกบันทึกลงฐานข้อมูล MySQL จริง</p>

                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

                    <form th:action="@{/register/doctor}" th:object="${doctor}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">ชื่อ</label>
                                <input th:field="*{firstName}" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">นามสกุล</label>
                                <input th:field="*{lastName}" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">อีเมล</label>
                                <input type="email" th:field="*{email}" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">เบอร์โทร</label>
                                <input th:field="*{phone}" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">สาขา</label>
                                <input th:field="*{specialty}" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">เลขใบอนุญาต</label>
                                <input th:field="*{licenseNumber}" class="form-control">
                            </div>
                            <div class="col-12">
                                <label class="form-label">รหัสผ่าน</label>
                                <input type="password" th:field="*{passwordHash}" class="form-control" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-4">สมัครหมอ</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
